# 暫時用的：在 GitHub 上抓免費商用（CC0）的真人配樂，存進 reels/music/
name: 抓配樂（暫時）
on:
  push:
    branches: [claude/project-thread-snuyo6]
    paths: [.github/workflows/music-fetch.yml, reels/music/sources.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 列出可用曲目
        run: |
          echo "=== freepd home"; curl -sL -m 30 https://freepd.com/ | head -c 3000; echo
          echo "=== freepd upbeat"; curl -sL -m 30 https://freepd.com/upbeat.php | grep -oiE '[^"'"'"' <>]+\.mp3' | sort -u | head -60
          echo "=== incompetech"; curl -sL -m 30 "https://incompetech.com/music/royalty-free/pieces.json" | head -c 1500; echo
          echo "=== archive cc0"; curl -sL -m 30 "https://archive.org/advancedsearch.php?q=licenseurl%3A%2Ahttp%3A%2F%2Fcreativecommons.org%2Fpublicdomain%2Fzero%2A+AND+mediatype%3Aaudio+AND+subject%3A%28background+music%29&fl%5B%5D=identifier&fl%5B%5D=title&rows=40&output=json" | head -c 4000; echo
      - name: 下載 sources.txt 裡的曲子
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          f=reels/music/sources.txt
          [ -s "$f" ] || exit 0
          while IFS='|' read -r name url; do
            [ -n "$name" ] || continue
            curl -sL -m 120 -o /tmp/in.mp3 "$url" && ffmpeg -y -loglevel error -i /tmp/in.mp3 -t 150 -af loudnorm=I=-16:TP=-1.5 -ac 2 -ar 44100 -b:a 128k "reels/music/$name.mp3" && echo "OK $name $(du -h "reels/music/$name.mp3" | cut -f1)" || echo "FAIL $name"
          done < "$f"
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add reels/music && git commit -qm "配樂：從 FreePD（CC0）下載" && git push -q || echo nothing
