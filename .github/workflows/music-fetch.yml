# 暫時用的：在 GitHub 上抓免費商用（CC0）的真人配樂，存進 reels/music/
name: 抓配樂（暫時）
on:
  push:
    branches: [claude/project-thread-snuyo6]
    paths: [.github/workflows/music-fetch.yml, reels/music/sources.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 列出 FreePD 曲目
        run: |
          for p in "" upbeat.php epic.php romantic.php world.php electronic.php scoring.php comedy.php misc.php; do
            echo "=== $p"
            curl -sL -m 30 "https://freepd.com/$p" | grep -oiE 'music/[^"'"'"' <>]+\.mp3' | sort -u | head -80
          done
      - name: 下載 sources.txt 裡的曲子
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          f=reels/music/sources.txt
          [ -s "$f" ] || exit 0
          while IFS='|' read -r name url; do
            [ -n "$name" ] || continue
            curl -sL -m 120 -o /tmp/in.mp3 "$url" && ffmpeg -y -loglevel error -i /tmp/in.mp3 -t 150 -af loudnorm=I=-16:TP=-1.5 -ac 2 -ar 44100 -b:a 128k "reels/music/$name.mp3" && echo "OK $name $(du -h "reels/music/$name.mp3" | cut -f1)" || echo "FAIL $name"
          done < "$f"
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add reels/music && git commit -qm "配樂：從 FreePD（CC0）下載" && git push -q || echo nothing
