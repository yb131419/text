# 暫時用的：在 GitHub 上抓免費商用（CC0）的真人配樂，存進 reels/music/
name: 抓配樂（暫時）
on:
  push:
    branches: [claude/project-thread-snuyo6]
    paths: [.github/workflows/music-fetch.yml, reels/music/sources.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 列出可用曲目
        run: |
          curl -sL -m 60 "https://incompetech.com/music/royalty-free/pieces.json" -o /tmp/p.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/p.json'))
          print('total', len(d))
          keys = ('Uplifting', 'Bright', 'Happy', 'Calm', 'Relax', 'Peace', 'Epic', 'Inspir', 'Romantic', 'Mystic', 'Hopeful', 'Somber', 'Grooving', 'Mysterious')
          bad = ('Horror', 'Dark', 'Scary', 'Aggressive', 'Medieval', 'Comedy', 'Silly')
          for x in d:
              f = x.get('feel') or ''
              if any(k in f for k in keys) and not any(b in f for b in bad) and '00:01:3' <= (x.get('length') or '') <= '00:05:00':
                  print('%s | %s | %s | %s | %s' % (x['filename'], x.get('length'), f, (x.get('instruments') or '')[:50], x.get('bpm')))
          PY
      - name: 下載 sources.txt 裡的曲子
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          f=reels/music/sources.txt
          [ -s "$f" ] || exit 0
          while IFS='|' read -r name url; do
            [ -n "$name" ] || continue
            curl -sL -m 120 -o /tmp/in.mp3 "$url" && ffmpeg -nostdin -y -loglevel error -i /tmp/in.mp3 -t 150 -af loudnorm=I=-16:TP=-1.5 -ac 2 -ar 44100 -b:a 128k "reels/music/$name.mp3" && echo "OK $name $(du -h "reels/music/$name.mp3" | cut -f1)" || echo "FAIL $name"
          done < "$f"
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add reels/music && git commit -qm "配樂：從 FreePD（CC0）下載" && git pull -q --rebase && git push -q || echo nothing
