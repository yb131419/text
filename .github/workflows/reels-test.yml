# 剪片程式有改時，在 GitHub 上實際剪一支測試影片，確認中文字幕真的有畫上去（Reels 和大片各一次）
name: 剪片自我測試
on:
  push:
    paths: [reels/**, .github/workflows/reels-test.yml, .github/workflows/reels.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reels
      - name: 安裝 ffmpeg 與中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          fc-cache -f > /dev/null
      - name: 剪 Reels（直式）
        run: |
          ffmpeg -y -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30:d=12 -f lavfi -i sine=d=12 -c:v libx264 -c:a aac /tmp/in.mp4
          python3 reels/reels.py --input /tmp/in.mp4 --transcript reels/selftest.json --out /tmp/r.mp4 --selftest
          ls reels/music
      - name: 剪大片（橫式）
        run: python3 reels/reels.py --input /tmp/in.mp4 --transcript reels/selftest.json --out /tmp/l.mp4 --mode long --selftest
      - name: 好幾支影片接起來剪
        run: |
          ffmpeg -y -loglevel error -f lavfi -i testsrc2=size=720x1280:rate=24:d=6 -c:v libx264 /tmp/v2.mp4
          python3 reels/reels.py --input /tmp/in.mp4,/tmp/v2.mp4 --transcript reels/selftest.json --out /tmp/m.mp4 --selftest
      - name: 靜音剪（配樂卡點、轉場、運鏡、文字動畫）
        run: |
          ffmpeg -y -loglevel error -f lavfi -i testsrc=size=1280x720:rate=30:d=40 -c:v libx264 /tmp/sil.mp4
          python3 reels/reels.py --input /tmp/sil.mp4 --transcript reels/selftest_silent.json --kind silent --out /tmp/s.mp4 --selftest
      - name: 靜音剪大片
        run: python3 reels/reels.py --input /tmp/sil.mp4 --transcript reels/selftest_silent.json --kind silent --mode long --out /tmp/sl.mp4 --selftest
