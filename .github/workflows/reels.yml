# 小乖剪 Reels：在 Telegram 傳影片給小乖並寫「剪 Reels」，小乖的 Apps Script 會觸發這個流程，
# 自動剪成直式 9:16、上中英字幕、配樂，再傳回 Telegram。程式在 reels/reels.py。
# 需要在 GitHub 的 Settings → Secrets and variables → Actions 設好 TELEGRAM_BOT_TOKEN、OPENAI_API_KEY。
name: 小乖剪 Reels

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram 聊天編號
        required: true
      file_id:
        description: Telegram 影片檔案編號
        required: true
      note:
        description: 影片說明（例如「剪 Reels 30秒」）
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reels

      - name: 安裝 ffmpeg 與中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null

      - name: 剪輯並傳回 Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.REELS_MODEL }}
          CHAT_ID: ${{ inputs.chat_id }}
          FILE_ID: ${{ inputs.file_id }}
          NOTE: ${{ inputs.note }}
        run: python3 reels/reels.py --out "$RUNNER_TEMP/reels.mp4"
